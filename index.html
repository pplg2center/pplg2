<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XI PPLG 2</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* =========================
           HALAMAN AWAL
        ========================= */

        .welcome-screen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: white;

            z-index: 1;
        }

        .welcome-screen::before {
            content: "";

            position: absolute;
            inset: -20px;

            background: url("baground.jpg")
                center 85% / cover no-repeat;

            filter: blur(4px);

            transform: scale(1.05);

            z-index: -2;
        }

        .welcome-screen::after {
            content: "";

            position: absolute;
            inset: 0;

            background: rgba(15, 23, 42, 0.42);

            z-index: -1;
        }
/* =========================
           TENGAH
        ========================= */

        .welcome-content {
            text-align: center;

            position: relative;

            z-index: 5;
        }

        .welcome-content h1 {
            font-size: clamp(40px, 7vw, 70px);

            font-weight: 900;

            margin-bottom: 8px;
        }

        .welcome-content p {
            margin-bottom: 28px;

            font-size: 15px;

            opacity: .9;
        }


        /* =========================
           TOMBOL MASUK
        ========================= */

        #enterButton {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            width: 170px;
            height: 52px;

            border: 1px solid rgba(255,255,255,.7);

            border-radius: 14px;

            background: rgba(255,255,255,.18);

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            backdrop-filter: blur(10px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.25);

            transition: .25s;
        }

        #enterButton:hover {
            background: rgba(255,255,255,.30);

            transform: translateY(-3px);
        }

        #enterButton:active {
            transform: scale(.95);
        }


        @media (max-width:600px) {

            .welcome-content h1 {

                font-size: 42px;
            }

        }
        

    </style>


    
</head>


<body>


<!-- =========================
     HALAMAN AWAL
========================= -->

<div id="welcomeScreen" class="welcome-screen">




    <!-- TENGAH -->

    <div class="welcome-content">

        <h1>XI PPLG 2</h1>

        <p>
            Pusat Informasi Kelas
        </p>

        <button
            type="button"
            id="enterButton">

            MASUK

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

</div>

<script>
(function () {
  const enterButton = document.getElementById('enterButton');
  if (enterButton) {
    enterButton.addEventListener('click', function () {
      window.location.assign('./class.html');
    });
  }
})();
</script>
